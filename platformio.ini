; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Keep the ESP32 Arduino 2.x APIs used by the original CYD screen driver
; (ledcSetup/ledcAttachPin) while the MQTT layer is modernized separately.
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs  
board_build.partitions = min_spiffs.csv
board_build.embed_txtfiles = setup/index.html
monitor_filters = esp32_exception_decoder
lib_deps = 
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@8.3.9
    https://github.com/knolleary/pubsubclient.git
    ArduinoJson@6.21.5
    FS
    SD
    https://github.com/PaulStoffregen/OneWire.git
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git
build_flags =
  -D__XTOUCH_SCREEN_28__
  -DLV_CONF_INCLUDE_SIMPLE
  -Iresources
  -DUSER_SETUP_LOADED
  -include resources/cyd_setup.h
  !python scripts/version.py
extra_scripts = 
    scripts/pre-build.py   
    scripts/post-build.py   

